[tools]
"npm:skills" = "latest"
jq = "latest"
uv = "latest"
hk = "latest"
pkl = "latest"
gitleaks = "latest"
"npm:oxfmt" = "latest"
yq = "4.53.6"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.sync]
description = "Symlink everything in skills/ globally for Codex and Claude Code"
run = [
  "skills add . --global --skill '*' --agent codex --agent claude-code --yes --full-depth",
  "./scripts/install-skill-tools.sh --check",
]

[tasks.install-skill-tools]
description = "Install the CLI tools declared by skills into the global mise config"
confirm = "Add or update the declared skill tools in your global mise config?"
run = "./scripts/install-skill-tools.sh"

[tasks.add]
description = "Vendor an external skill into skills/ as a pinned snapshot, e.g. `mise run add shadcn/improve`"
run = "./scripts/vendor-skill.sh"

[tasks.update]
description = "Advance vendored skills to their tracked branch heads (previews and asks first)"
run = "./scripts/update-skills.sh"

[tasks.relock]
description = "Keep vendored commits pinned and refresh hashes after overlay changes"
run = "./scripts/update-skills.sh --relock"

[tasks.restore]
description = "Re-fetch vendored skills at their pinned commits, discarding local edits"
run = "./scripts/update-skills.sh --locked"

[tasks.verify]
description = "Offline check of the manifest, lock, snapshot hashes, licenses and catalog"
run = "./scripts/verify-skills.sh"

[tasks.hk-excludes]
description = "Regenerate hk-vendored.pkl so hk's fixers skip the vendored snapshots"
run = "./scripts/sync-hk-excludes.sh"

[tasks.update-project]
description = "Refresh project-only skills in .agents/skills via the skills CLI"
run = "skills update --project --yes"
