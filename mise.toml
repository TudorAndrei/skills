[tools]
"npm:skills" = "latest"
uv = "latest"
hk = "latest"
pkl = "latest"
gitleaks = "latest"
"npm:oxfmt" = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.sync]
description = "Symlink all local skills globally for generic agents and Claude Code"
run = "skills add . --global --skill '*' --agent codex --agent claude-code --yes --full-depth"
